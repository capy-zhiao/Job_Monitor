name: job-monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: write             # allow committing seen.json back to the repo

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 run.py --emit-json docs/jobs.json

      - name: Commit state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json health.json docs/jobs.json docs/first_seen.json docs/history.json docs/logos
          git diff --cached --quiet || git commit -m "update seen jobs [skip ci]"
          # A push to main during the run would reject this one and lose the
          # new seen.json (the next run would alert the same jobs again), so
          # rebase onto it first and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
